<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>직업 옷입히기 클립아트 놀이</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">마우스로 끌어다 놓는 직업 탐험</p>
        <h1 id="page-title">직업 옷입히기 클립아트 놀이</h1>
        <p class="hero-copy">
          맨몸 캐릭터에게 직업 의상을 입혀 보세요. 의상을 무대 위 캐릭터에게 끌어다 놓으면
          캐릭터가 변신하고, 그 직업이 하는 일을 알려줘요.
        </p>
      </section>

      <section class="playground" aria-label="직업 옷입히기 놀이 영역">
        <div class="stage-card">
          <div
            id="character-stage"
            class="character-stage"
            aria-label="의상을 놓는 캐릭터 영역"
            tabindex="0"
          >
            <div class="drop-hint">여기에 의상을 놓아 주세요</div>
            <svg class="character" viewBox="0 0 260 360" role="img" aria-labelledby="character-title character-desc">
              <title id="character-title">직업 의상을 입는 캐릭터</title>
              <desc id="character-desc">선택한 직업 의상에 따라 옷과 소품이 바뀌는 클립아트 캐릭터</desc>
              <g class="body">
                <circle cx="130" cy="58" r="36" fill="#ffd3b6" />
                <path d="M89 51c7-27 30-43 58-33 18 6 28 21 29 39-22-11-49-10-87-6Z" fill="#5b3a29" />
                <circle cx="117" cy="62" r="4" fill="#2e2e2e" />
                <circle cx="143" cy="62" r="4" fill="#2e2e2e" />
                <path d="M117 78c8 8 20 8 28 0" fill="none" stroke="#ad5d51" stroke-width="4" stroke-linecap="round" />
                <path d="M92 119c0-23 17-42 38-42s38 19 38 42v80H92v-80Z" fill="#ffe8d9" />
                <path d="M92 122 52 178" stroke="#ffd3b6" stroke-width="22" stroke-linecap="round" />
                <path d="M168 122 208 178" stroke="#ffd3b6" stroke-width="22" stroke-linecap="round" />
                <path d="M107 199v101" stroke="#ffd3b6" stroke-width="26" stroke-linecap="round" />
                <path d="M153 199v101" stroke="#ffd3b6" stroke-width="26" stroke-linecap="round" />
                <ellipse cx="107" cy="322" rx="27" ry="12" fill="#4c6fff" />
                <ellipse cx="153" cy="322" rx="27" ry="12" fill="#4c6fff" />
              </g>
              <g id="outfit-layer" class="outfit-layer"></g>
            </svg>
          </div>
          <div class="character-label">
            <span id="profession-badge" class="badge">준비 중</span>
            <h2 id="profession-title">어떤 직업으로 변신할까요?</h2>
            <p id="profession-description">
              오른쪽 의상 카드 중 하나를 캐릭터에게 끌어다 놓거나, 카드를 클릭한 뒤 캐릭터 영역을 누르세요.
            </p>
          </div>
        </div>

        <aside class="wardrobe" aria-labelledby="wardrobe-title">
          <h2 id="wardrobe-title">직업 의상</h2>
          <p>카드를 드래그하거나 클릭해서 의상을 선택하세요.</p>
          <div id="costume-list" class="costume-list"></div>
        </aside>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
